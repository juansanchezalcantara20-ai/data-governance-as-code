apiVersion: v3.0.2
kind: DataContract
id: urn:datacontract:supply_chain:silver.material_issues
name: silver.material_issues
version: 1.0.0
status: active
domain: supply_chain
dataProduct: Material consumption
description:
  purpose: Validated warehouse issues to service orders with line cost.
  usage: Actual material cost per order; consumption for inventory cover.
  limitations: Issued unit cost must stay within 25% of the material master (accuracy rule).
tags: [silver, transactions]
team:
  - {username: jordan.mockwell, role: data_owner}
  - {username: casey.testa, role: data_steward}
slaProperties:
  - {property: latency, value: 3, unit: d, element: silver.material_issues.issued_on}
customProperties:
  - {property: dataClassification, value: internal}
  - property: changePolicy
    value:
      versioning: semver
      breaking: [remove a column, rename a column, change a logical type, make a column required, change the primary key, raise the classification]
      nonBreaking: [add an optional column, add or relax a quality rule, improve descriptions]
      breakingRequires: major version bump and Data Owner approval (raci.change_data_contract)
      deprecationNoticeDays: 30
schema:
  - name: material_issues
    physicalName: silver.material_issues
    physicalType: table
    description: One row per issue line.
    properties:
      - {name: issue_id, logicalType: string, physicalType: VARCHAR, primaryKey: true, primaryKeyPosition: 1,
         businessName: Material issue, description: Issue id MI-nnnnnn.}
      - {name: order_id, logicalType: string, physicalType: VARCHAR, required: true, description: Service order charged.,
         quality: [{name: issue_order_exists, type: library, rule: references, arguments: {table: silver.service_orders, column: order_id}}]}
      - {name: material_id, logicalType: string, physicalType: VARCHAR, required: true, description: Material issued.,
         quality: [{name: issue_material_exists, type: library, rule: references, arguments: {table: silver.materials, column: material_id}}]}
      - {name: quantity, logicalType: integer, physicalType: INTEGER, required: true, description: Units issued.,
         quality: [{name: quantity_positive, type: library, rule: range, arguments: {min: 1}}]}
      - name: unit_cost
        logicalType: number
        physicalType: DOUBLE
        required: true
        description: Unit cost at issue.
        quality:
          - {name: issue_unit_cost_positive, type: library, rule: range, arguments: {min: 0.01}}
          - name: issue_cost_matches_master
            type: library
            rule: tolerance
            dimension: accuracy
            arguments: {key: material_id, referenceTable: silver.materials, referenceKey: material_id,
                        referenceColumn: unit_cost, maxDeviationPct: 25}
            description: Issued cost must agree with the material master within 25% (catches decimal-shift errors).
      - {name: line_cost, logicalType: number, physicalType: DOUBLE, description: Quantity times unit cost.}
      - {name: issued_on, logicalType: date, physicalType: DATE, required: true, description: Issue date.}
