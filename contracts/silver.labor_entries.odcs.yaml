apiVersion: v3.0.2
kind: DataContract
id: urn:datacontract:operations:silver.labor_entries
name: silver.labor_entries
version: 1.0.0
status: active
domain: operations
dataProduct: Service operations
description:
  purpose: Validated hours booked by technicians against service orders.
  usage: Actual labor hours and cost per service order.
  limitations: approver_email is a known open finding (personal data not yet declared); see docs/roadmap.md.
tags: [silver, transactions]
team:
  - {username: riley.placeholder, role: data_owner}
  - {username: sam.samplewood, role: data_steward}
slaProperties:
  - {property: latency, value: 3, unit: d, element: silver.labor_entries.work_date}
customProperties:
  - {property: dataClassification, value: internal}
  - property: changePolicy
    value:
      versioning: semver
      breaking: [remove a column, rename a column, change a logical type, make a column required, change the primary key, raise the classification]
      nonBreaking: [add an optional column, add or relax a quality rule, improve descriptions]
      breakingRequires: major version bump and Data Owner approval (raci.change_data_contract)
      deprecationNoticeDays: 30
schema:
  - name: labor_entries
    physicalName: silver.labor_entries
    physicalType: table
    description: One row per technician, order and day.
    properties:
      - {name: entry_id, logicalType: string, physicalType: VARCHAR, primaryKey: true, primaryKeyPosition: 1,
         businessName: Labor entry, description: Entry id LE-nnnnnn.}
      - {name: order_id, logicalType: string, physicalType: VARCHAR, required: true, description: Service order charged.,
         quality: [{name: labor_order_exists, type: library, rule: references, arguments: {table: silver.service_orders, column: order_id}}]}
      - {name: technician_id, logicalType: string, physicalType: VARCHAR, required: true, description: Technician who worked.,
         quality: [{name: labor_technician_exists, type: library, rule: references, arguments: {table: silver.technicians, column: technician_id}}]}
      - {name: work_date, logicalType: date, physicalType: DATE, required: true, description: Day worked.}
      - {name: hours, logicalType: number, physicalType: DOUBLE, required: true, businessName: Labor hours, description: Hours booked.,
         quality: [{name: hours_range, type: library, rule: range, arguments: {min: 0.5, max: 24},
                    description: Nobody works more than 24 hours in a day.}]}
      - {name: approver_email, logicalType: string, physicalType: VARCHAR, description: Email of the supervisor who approved the entry.}
