apiVersion: v3.0.2
kind: DataContract
id: urn:datacontract:supply_chain:silver.materials
name: silver.materials
version: 1.0.0
status: active
domain: supply_chain
dataProduct: Material master
description:
  purpose: Material master with standard cost and stock parameters; reference for issued costs.
  usage: Inventory position, accuracy check of issued unit costs.
  limitations: Stock is a daily snapshot.
tags: [silver, master-data]
team:
  - {username: jordan.mockwell, role: data_owner}
  - {username: casey.testa, role: data_steward}
slaProperties:
  - {property: frequency, value: 1, unit: d}
customProperties:
  - {property: dataClassification, value: internal}
  - property: changePolicy
    value:
      versioning: semver
      breaking: [remove a column, rename a column, change a logical type, make a column required, change the primary key, raise the classification]
      nonBreaking: [add an optional column, add or relax a quality rule, improve descriptions]
      breakingRequires: major version bump and Data Owner approval (raci.change_data_contract)
      deprecationNoticeDays: 30
schema:
  - name: materials
    physicalName: silver.materials
    physicalType: table
    description: One row per material.
    properties:
      - {name: material_id, logicalType: string, physicalType: VARCHAR, primaryKey: true, primaryKeyPosition: 1,
         businessName: Material, description: Material code MA-nnnn.}
      - {name: description, logicalType: string, physicalType: VARCHAR, required: true, description: Material description.}
      - {name: category, logicalType: string, physicalType: VARCHAR, description: Material category.}
      - {name: unit_cost, logicalType: number, physicalType: DOUBLE, required: true, businessName: Unit cost, description: Standard unit cost.,
         quality: [{name: unit_cost_positive, type: library, rule: range, arguments: {min: 0.01}}]}
      - {name: stock_on_hand, logicalType: integer, physicalType: INTEGER, businessName: Stock on hand, description: Units in stock.,
         quality: [{name: stock_non_negative, type: library, rule: range, arguments: {min: 0}}]}
      - {name: reorder_point, logicalType: integer, physicalType: INTEGER, businessName: Reorder point, description: Replenishment trigger.,
         quality: [{name: reorder_point_non_negative, type: library, rule: range, arguments: {min: 0}}]}
      - {name: lead_time_days, logicalType: integer, physicalType: INTEGER, description: Supplier lead time in days.}
