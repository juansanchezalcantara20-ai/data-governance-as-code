repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: ^(docs/generated/|deploy/unity_catalog/.*\.sql$)
  - repo: local
    hooks:
      - id: govkit-validate
        name: govkit validate (governance as code)
        entry: python -m govkit validate
        language: system
        pass_filenames: false
        files: ^(governance|contracts|models)/
