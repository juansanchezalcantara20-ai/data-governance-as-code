[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "govkit"
version = "1.0.0"
description = "Governance as code on a Medallion lakehouse: roles, RACI, access policy, glossary, ODCS data contracts, quality and lineage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Juan Luis Sánchez Alcántara" }]
dependencies = ["duckdb>=1.1", "pyyaml>=6", "sqlglot>=25", "pandas>=2"]

keywords = ["data governance", "data quality", "data contracts", "ODCS", "DAMA-DMBOK", "lineage", "duckdb"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/juansanchezalcantara20-ai/data-governance-as-code"
Documentation = "https://github.com/juansanchezalcantara20-ai/data-governance-as-code/tree/main/docs"
Changelog = "https://github.com/juansanchezalcantara20-ai/data-governance-as-code/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3"]

[project.scripts]
govkit = "govkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]
