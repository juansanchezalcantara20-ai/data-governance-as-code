# ILLUSTRATIVE value assumptions ("supuestos ilustrativos"). Replace them with your organisation's own figures.
# They are NOT taken from any real company. Amounts in Peruvian soles (PEN). The engine (govkit/value.py)
# combines them with what the pipeline actually caught; the demo app lets a visitor change them and recalculate.
#
# Legal context (no amounts on purpose): in Peru, personal data is protected by Law No. 29733 (Ley de Protección de
# Datos Personales) and its regulation. Sanctions exist, but this project does not estimate fines; it only counts
# the internal effort of handling an incident.
currency: PEN
assumptions:
  analyst_hour_cost:
    value: 45
    min: 20
    max: 150
    step: 5
    unit: PEN per hour
    es: Costo de una hora de trabajo de analista
    en: Cost of one analyst hour
  rework_hours_per_bad_row:
    value: 0.5
    min: 0.1
    max: 4
    step: 0.1
    unit: hours per row
    es: Horas de retrabajo por cada dato malo que llega a un reporte (rastrear, corregir, volver a publicar)
    en: Rework hours for each bad record that reaches a report (trace, fix, republish)
  bad_rows_per_wrong_decision:
    value: 25
    min: 5
    max: 200
    step: 5
    unit: rows per decision
    es: Datos malos que, en promedio, terminan en una decisión equivocada
    en: Bad records that, on average, end up in one wrong decision
  wrong_decision_cost:
    value: 3000
    min: 0
    max: 50000
    step: 500
    unit: PEN per decision
    es: Costo de una decisión tomada con un dato errado (cotizar mal, reponer de más, priorizar mal)
    en: Cost of one decision taken on wrong data (mispricing, over-ordering, wrong priority)
  dispute_hours_per_metric:
    value: 1
    min: 0
    max: 10
    step: 0.5
    unit: hours per metric per month
    es: Horas al mes que se pierden discutiendo «cuál número es el correcto», por indicador sin definición única
    en: Hours per month lost arguing "which number is right", per metric without a single definition
  people_per_dispute:
    value: 3
    min: 1
    max: 10
    step: 1
    unit: people
    es: Personas que participan en esa discusión
    en: People involved in that discussion
  incident_hours:
    value: 40
    min: 8
    max: 200
    step: 4
    unit: hours per incident
    es: Horas para atender un incidente por un dato personal expuesto (investigar, contener, comunicar, corregir)
    en: Hours to handle an incident with an exposed personal-data field (investigate, contain, communicate, fix)
  exposure_probability_per_year:
    value: 0.2
    min: 0
    max: 1
    step: 0.05
    unit: probability per year
    es: Probabilidad anual de que un dato personal sin base de uso termine expuesto
    en: Yearly probability that an undeclared personal-data field ends up exposed
