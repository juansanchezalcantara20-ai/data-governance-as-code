# RACI per governance activity. R = Responsible, A = Accountable (exactly one), C = Consulted, I = Informed.
# Roles must exist in roles.yaml. Validated by govkit/validate/roles.py.
activities:
  - id: define_glossary_term
    name: Define a glossary term
    description: Draft the definition, formula, source and rules of a business term.
    raci: {data_steward: R, data_owner: A, data_consumer: C, data_custodian: C}

  - id: approve_glossary_term
    name: Approve a glossary term
    description: Move a term from draft to approved; shared terms go to the Council.
    raci: {data_owner: A, data_steward: R, governance_council: C, data_consumer: I}

  - id: approve_quality_rule
    name: Approve a quality rule
    description: Accept a new or changed rule and its severity in a data contract.
    raci: {data_owner: A, data_steward: R, data_custodian: C, data_consumer: I}

  - id: resolve_quality_incident
    name: Resolve a quality incident
    description: Triage quarantined rows or failed checks, fix at source and close the incident.
    raci: {data_steward: A, data_custodian: R, data_owner: I, data_consumer: I, field_technician: C}

  - id: approve_access_request
    name: Approve an access request
    description: Grant time-bound access above a user's role baseline. Requester can never approve.
    raci: {data_owner: A, data_steward: R, data_custodian: R, governance_council: I, auditor: I}

  - id: change_data_contract
    name: Change a data contract
    description: Version a contract. Breaking changes need a major version and Owner approval.
    raci: {data_owner: A, data_steward: R, data_custodian: R, data_consumer: C}

  - id: retire_dataset
    name: Retire a dataset
    description: Deprecate, notify consumers, wait the notice period and decommission.
    raci: {governance_council: A, data_owner: R, data_custodian: R, data_consumer: C, data_sponsor: I}

  - id: classify_dataset
    name: Classify a dataset
    description: Assign public, internal, confidential or restricted and the PII tags.
    raci: {data_owner: A, data_steward: R, governance_council: C, data_custodian: I}

  - id: approve_policy
    name: Approve a governance policy
    description: Adopt or change an enterprise data policy or standard.
    raci: {governance_council: A, data_steward: R, data_owner: C, auditor: C, data_sponsor: I}
