name: Publish demo app and docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: make install && pip install -r requirements-docs.txt
      - name: Tests and full reproduction
        run: make all
      - name: The published app data is exactly what the engine produces
        run: python -m govkit export-app --check
      - name: Build the technical documentation (MkDocs)
        run: mkdocs build
      - name: Assemble the site (app at the root, docs under /docs/)
        run: |
          mkdir -p _site
          cp -r app/. _site/
          cp -r site/docs _site/docs
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
