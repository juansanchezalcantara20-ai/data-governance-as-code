name: CI

on:
  push:
  pull_request:

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: make install
      - name: Reproduce everything (lint, validate governance, generate, run, test)
        run: make all
      - name: Generated docs are up to date
        run: make docs-check
      - name: Contract changes follow the change policy (pull requests)
        if: github.event_name == 'pull_request'
        run: python -m govkit compat --base origin/${{ github.base_ref }}
